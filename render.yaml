services:
  - type: web
    name: bilisub
    runtime: node
    plan: free
    buildCommand: |
      npm install --omit=dev
      curl -sL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
      chmod +x yt-dlp
    startCommand: node server.js
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: BIND_HOST
        value: 0.0.0.0
